<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataWatch</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">
        <h1>DataWatch</h1>
        <p>Browser Data Monitor</p>


        <div class="usage-card">
            <span>Total Browser Usage</span>
            <h2 id="totalUsage">0 KB</h2>
            <p>Current Session</p>
        </div>


        <div class="usage-card">
            <span>Last 1 Hour</span>
            <h2 id="hourUsage">0 KB</h2>
        </div>


        <button id="monitorBtn">Start Monitoring...</button>

    </div>

    <script src="popup.js"></script>

</body>

</html>
